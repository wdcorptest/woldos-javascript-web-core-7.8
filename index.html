<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>CPS - Ремонт техники и сервисные услуги</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
<aside class="sidebar">
    <div class="sidebar__header">
        <div class="sidebar__upper-menu">
            <div class="sidebar__upper-menu-left">
                <button type="button"
                class="sidebar__button-close">
                <img src="./images/back.svg"
                alt="Закрыть меню"
                class="sidebar__button-close-icon">
                </button>
                <a class="sidebar__logo"
                href="./index.html">
                <img src="./images/logo.svg"
                alt="Логотип"
                class="sidebar__logo-icon">
                </a>
            </div>
            <div class="sidebar__upper-menu-right">
                <button type="button"
                class="sidebar__button-search">
                <img src="./images/search.svg"
                alt="Поиск"
                class="sidebar__button-search-icon">
                </button>
            </div>
        </div>

        <nav class="sidebar__navigation">
            <ul class="sidebar__navigation-list">
                <li class="sidebar__navigation-item">
                    <a href="#" class="sidebar__navigation-link--active">Ремонт техники</a>
                </li>
                <li class="sidebar__navigation-item">
                    <a href="#" class="sidebar__navigation-link">Услуги и сервисы</a>
                </li>
                <li class="sidebar__navigation-item">
                    <a href="#" class="sidebar__navigation-link">Корпоративным клиентам</a>
                </li>
                <li class="sidebar__navigation-item">
                    <a href="#" class="sidebar__navigation-link">Продавцам техники</a>
                </li>
                <li class="sidebar__navigation-item">
                    <a href="#" class="sidebar__navigation-link">Партнерам</a>
                </li>
                <li class="sidebar__navigation-item">
                    <a href="#" class="sidebar__navigation-link">Производителям</a>
                </li>
                <li class="sidebar__navigation-item">
                    <a href="#" class="sidebar__navigation-link">Наши сервисные центры</a>
                </li>
                <li class="sidebar__navigation-item">
                    <a href="#" class="sidebar__navigation-link">Контакты</a>
                </li>
            </ul>
        </nav>
    </div>

    <div class="sidebar__footer">
        <div class="sidebar__button-box">
            <button type="button"
            class="sidebar__button-call">
            <img src="./images/call.svg"
            alt="Позвонить"
            class="sidebar__button-call-icon">
            </button>

            <button type="button"
            class="sidebar__button-chat">
            <img src="./images/chat.svg"
            alt="Написать"
            class="sidebar__button-chat-icon">
            </button>

            <button type="button"
            class="sidebar__button-profile">
            <img src="./images/profile.svg"
            alt="Профиль"
            class="sidebar__button-profile-icon">
            </button>
        </div>

        <address class="sidebar__address">
            <a href="mailto:mail@cps.com"
            class="sidebar__address-mail">
            mail@cps.com
            </a>
            <a href="tel:88008908900"
            class="sidebar__address-telephone">
            8 800 890 8900
            </a>
        </address>

        <div class="sidebar__language-box">
            <label for="ru"
                class="sidebar__language-ru">
                <input type="radio"
                name="language"
                id="ru" checked>
                RU
            </label>

            <label for="en"
            class="sidebar__language-en">
                <input type="radio"
                name="language"
                id="en">
                EN          
            </label>

            <label for="ch"
            class="sidebar__language-ch">
                <input type="radio"
                name="language"
                id="ch">
                CH           
            </label>
        </div>
    </div>
</aside>
</body>
</html>
